# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - PharmacyCalloway

concurrency:
  group: pharmacycalloway-production-deploy
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run composer install if composer.json exists
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish
            composer install --prefer-dist --no-progress
          else
            echo "composer.json not found - skipping composer install"
          fi

      - name: Prepare deployment package
        run: |
          mkdir -p deploy_package
          rsync -a ./ ./deploy_package \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_deploy_bundle/' \
            --exclude='_archive_dev/' \
            --exclude='deploy_ready_*.zip' \
            --exclude='medicine_images/' \
            --exclude='html_guides/' \
            --exclude='__pycache__/' \
            --exclude='backups/' \
            --exclude='cache/' \
            --exclude='logs/' \
            --exclude='*.md' \
            --exclude='scan_report.html'

      - name: Verify critical files in package
        run: |
          test -f deploy_package/login.php
          test -f deploy_package/onlineordering.php

      - name: Create deployment zip
        run: |
          cd deploy_package
          zip -r ../php-app.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: php-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    env:
      AZ_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_495B0B0777B64BA3969DCD590D8F0175 }}
      AZ_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_5F55D94C32F34FA2BAB448C4FB149026 }}
      AZ_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3A979E6025D54F4487C3C0CA4744B9B1 }}
      AZ_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Verify downloaded package
        run: ls -lah
      
      - name: Login to Azure (Service Principal)
        if: ${{ env.AZ_CLIENT_ID != '' && env.AZ_TENANT_ID != '' && env.AZ_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenant-id: ${{ env.AZ_TENANT_ID }}
          subscription-id: ${{ env.AZ_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (Service Principal)
        if: ${{ env.AZ_CLIENT_ID != '' && env.AZ_TENANT_ID != '' && env.AZ_SUBSCRIPTION_ID != '' }}
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'PharmacyCalloway'
          slot-name: 'Production'
          package: php-app.zip

      - name: Deploy to Azure Web App (Publish Profile fallback)
        if: ${{ !(env.AZ_CLIENT_ID != '' && env.AZ_TENANT_ID != '' && env.AZ_SUBSCRIPTION_ID != '') && env.AZ_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PharmacyCalloway'
          slot-name: 'Production'
          publish-profile: ${{ env.AZ_PUBLISH_PROFILE }}
          package: php-app.zip

      - name: Fail when Azure credentials are missing
        if: ${{ !(env.AZ_CLIENT_ID != '' && env.AZ_TENANT_ID != '' && env.AZ_SUBSCRIPTION_ID != '') && env.AZ_PUBLISH_PROFILE == '' }}
        run: |
          echo "No Azure deployment credentials configured."
          echo "Set either Service Principal secrets (client/tenant/subscription) or AZURE_WEBAPP_PUBLISH_PROFILE in repository secrets."
          exit 1
          